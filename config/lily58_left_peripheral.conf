# Silakka54 LEFT half display — Hammerbeam slideshow.
#
# GPeye/hammerbeam-slideshow: 30 pieces of Hammerbeam's 1-bit art (he drew the
# balloon and mountain in stock ZMK too), cycled. The module's CMakeLists builds
# widgets/art.c + widgets/peripheral_status.c whenever the board is a split
# PERIPHERAL — which every half is in dongle mode — so this side gets the
# slideshow. His signature stays on each picture for attribution.
#
# This does NOT cost you status info: peripheral_status.c's draw_top() still
# draws the battery gauge and the link symbol (WIFI connected / CLOSE dropped)
# over the art, same as ZMK's stock nice!view peripheral widget.
#
# The two halves each run their own timer from power-on, so they drift out of
# sync and show different pictures. That is expected, not a fault.

# Total duration for one pass of all 30 pictures, in ms.
# 300000 = 10s each (module default, chosen to save battery).
# 150000 = 5s each. Don't go much below ~60000 or the panel redraws constantly.
CONFIG_CUSTOM_ANIMATION_SPEED=300000

# ─── REQUIRED: the fix for garbled art ────────────────────────────────────
# LV_Z_VDB_SIZE is a PERCENTAGE of the display LVGL renders in one pass.
# Both the lily58 and corne shields in this repo carry `if LVGL ->
# LV_Z_VDB_SIZE 64, LV_DPI_DEF 148` — OLED numbers. Kconfig takes the FIRST
# default it sees, and a board shield beats a module-provided shield, so
# nice_view_custom silently renders into a 64% buffer and tears.
# ZMK's own nice_view shield wins that race, which is why the stock screens
# always looked fine and only the custom ones were mangled.
# A value in this .conf beats every Kconfig default. Verified by building.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=161

# The module ships CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n so the slideshow keeps
# cycling while the keyboard is idle. That is this module's main battery cost,
# and with art on both halves you pay it twice. Uncomment to blank on idle.
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
