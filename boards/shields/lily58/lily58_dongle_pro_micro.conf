# MC:
# compatible con todas las versiones de nrf52840 (pro_micro):
# - nice_nano (no  probado)
# - nice_nano_v2 (probado)
# - nice_nano_v2 (super mini -> nice_nano_v2 clon) (probado)
# - nrfmicro_11 (no probado)
# - nrfmicro_11_flipped (no probado)
# - nrfmicro_13 (no probado)
# - puchi_ble_v1 (probado)

### DONGLE MODE
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

### DONGLE OPTIONS
# 3 profiles (n+2)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

### DISPLAY DONGLE OPTIONS
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

### POWER OPTIONS
# La unidad del intervalo del informe de energía de la batería es segundos
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

### DEBUG OPTIONS
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

### PAIRING
# A dongle has no keys, so it cannot type a passkey. mctechnology17's
# lily58.conf enables ZMK_BLE_EXPERIMENTAL_FEATURES, which *implies*
# ZMK_BLE_PASSKEY_ENTRY -> Windows then demands a code "on the keyboard".
# Disable it explicitly (this is what PandaKB ship on their dongle).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

### The dongle is mains/USB powered and is the central. If it sleeps the
### whole keyboard goes away. mctechnology17 set this via build.yaml
### cmake-args; putting it here means it can't be lost again.
# CONFIG_ZMK_SLEEP=n   # reverted: this was the ONLY functional diff vs the
#                      # last firmware that typed. Re-enable only after typing
#                      # is confirmed stable.
